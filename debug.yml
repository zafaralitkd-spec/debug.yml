name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -L -o src.zip "https://muse.ai/files/1393882757140577/1103436852175930/rwauod0oibxw24g778idygye/BallSort3DPremium-final.zip"
          unzip -q src.zip
          mv BallSort3DPremium game
      - uses: actions/setup-node@v4
        with: {node-version: 24}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - run: npm ci
        working-directory: game
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: game/android
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: game/android/app/build/outputs/apk/debug/app-debug.apk
